---
# site/roles/trinity/alertx/tasks/cli.yml, directly after "Render alertx luna.ini".
# The CLI directory is a symlink into site-packages that this role makes, so the
# trix-daemon role cannot write there first.

- name: Render alertx trixd.ini
  include_role:
    name: trinity/trix-daemon
    tasks_from: alertx
  when: trixd_enabled | default(True)
