---
# Paste into site/controller.yml, in the roles list, directly after the
# trinity/luna2 entry. trix-daemon reads Luna objects by name when it reconciles
# its renders at startup, so Luna is installed and running first. Luna never
# needs trix-daemon, so the dependency points one way only.

- role: trinity/trix-daemon
  when: trixd_enabled | default(True)
  ssl_certificate: "{{ ssl_cert_path }}/{{ ansible_fqdn }}.crt"
  ssl_certificate_key: "{{ ssl_cert_path }}/{{ ansible_fqdn }}.key"
  trixd_password: "{{ lookup('password', '/etc/trinity/passwords/trix/api.txt chars=ascii_letters,digits') }}"
  tags: trix, trix-daemon
