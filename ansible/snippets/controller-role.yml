---
# Paste into the site/controller.yml roles list, directly after trinity/luna2:
# renders reconcile against Luna at startup, and Luna never needs us back. The
# password, the certificate pair and the secret are the role's defaults, so the
# roles that include it for a client's trixd.ini get the same values.

- role: trinity/trix-daemon
  when: trixd_enabled | default(True)
  tags: trix, trix-daemon
