---
# site/roles/trinity/image-create/tasks/{redhat,ubuntu,opensuse}/extend.yml,
# directly after "Include luna2 tasks". That include is what writes the node's
# luna.ini into the image; this writes its trixd.ini beside it. The role skips
# the daemon itself whenever extend_image is set.

- name: Include trix-daemon tasks
  include_role:
    name: trinity/trix-daemon
  vars:
    extend_image: true
  when: trixd_enabled | default(True)
