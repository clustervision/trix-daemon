---
# Replaces the luna_nodes job in site/controller.yml: the first entry of
# prometheus_server_additional_sd on the trinity/prometheus-server role, indented eight
# spaces as it is there.

# With trix-daemon installed the targets come from its render, served from memory, so
# an unchanged poll costs no call to Luna. With trixd_enabled false the job reads
# Luna's /export/prometheus exactly as before. Prometheus runs on the controller, where
# the plain listener is on the loopback, so there is no certificate and no token: the
# targets endpoint is public because service discovery presents none. tls_config only
# applies to Luna's https address.

        - job_name: luna_nodes
          http_sd_configs:
          - url: "{{ ('http://' ~ (trixd_plain_bind | default('127.0.0.1')) ~ ':' ~ (trixd_plain_port | default(8051)) ~ '/api/v1/prometheus/renders/targets') if (trixd_enabled | default(True)) else (luna_protocol ~ '://localhost:7050/export/prometheus') }}"
            tls_config:
              insecure_skip_verify: true
          metric_relabel_configs:
            # Drop transient systemd unit states to reduce cardinality.
            - source_labels: ['__name__', 'state']
              regex: 'node_systemd_unit_state;(activating|deactivating)'
              action: drop
