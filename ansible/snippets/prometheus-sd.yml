---
# Replace the luna_nodes job in site/controller.yml, inside the
# prometheus_server_additional_sd list on the trinity/prometheus-server role.
#
# Before, pointing at Luna:
#   - job_name: luna_nodes
#     http_sd_configs:
#     - url: "{{ luna_protocol }}://localhost:7050/export/prometheus"
#
# After, pointing at trix-daemon. The document is served from the render rather
# than rebuilt per poll, so the cost of a poll that changes nothing is one hash
# comparison instead of a pass over every node.
#
# The plain listener is on the loopback, which is where Prometheus runs, so this
# needs no certificate and no token. The endpoint declares itself public for
# exactly this reason, because service discovery presents no credentials.

- job_name: luna_nodes
  http_sd_configs:
    - url: "http://{{ trixd_plain_bind }}:{{ trixd_plain_port }}/api/v1/prometheus/renders/targets"
  metric_relabel_configs:
    # Drop transient systemd unit states to reduce cardinality.
    - source_labels: ['__name__', 'state']
      regex: 'node_systemd_unit_state;(activating|deactivating)'
      action: drop
