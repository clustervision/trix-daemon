---
# Replace the luna_nodes job in site/controller.yml, inside the
# prometheus_server_additional_sd list on the trinity/prometheus-server role.

# It pointed at Luna's /export/prometheus on 7050, which rebuilt the document per
# poll. This is served from the render, so an unchanged poll costs one hash.

# Prometheus runs on the loopback, where the plain listener is, so no certificate
# and no token: the endpoint is declared public because service discovery has none.

- job_name: luna_nodes
  http_sd_configs:
    - url: "http://{{ trixd_plain_bind }}:{{ trixd_plain_port }}/api/v1/prometheus/renders/targets"
  metric_relabel_configs:
    # Drop transient systemd unit states to reduce cardinality.
    - source_labels: ['__name__', 'state']
      regex: 'node_systemd_unit_state;(activating|deactivating)'
      action: drop
