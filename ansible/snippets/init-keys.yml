---
# Append to site/roles/trinity/init/tasks/keys.yml, beside the blocks that already
# create luna's secret.key and the omapi key. Same create-once idiom: generate if
# absent, import if present, so a re-run never replaces a key that tokens were
# signed with.
#
# The keypair has to exist before either daemon starts. A key that must exist
# before the first token can be signed cannot be signed by the thing that needs
# it, which is why this is here and not in the trix-daemon role.

- block:
  - name: Verify if the trix signing key exists
    stat:
      path: "{{ trix_ssl }}/trix.ed25519"
    register: stat_trix_key

  - block:
    - name: Generate the trix-daemon keypair
      command: >-
        {{ trix_local }}/python/bin/python3 -c
        "from cryptography.hazmat.primitives import serialization as s;
        from cryptography.hazmat.primitives.asymmetric import ed25519 as e;
        k=e.Ed25519PrivateKey.generate();
        open('{{ trix_ssl }}/trix.ed25519','wb').write(k.private_bytes(s.Encoding.PEM,
        s.PrivateFormat.PKCS8, s.NoEncryption()));
        open('{{ trix_ssl }}/trix.ed25519.pub','wb').write(k.public_key().public_bytes(
        s.Encoding.PEM, s.PublicFormat.SubjectPublicKeyInfo))"
      args:
        creates: "{{ trix_ssl }}/trix.ed25519"

    - name: Restrict the private key
      file:
        path: "{{ trix_ssl }}/trix.ed25519"
        mode: '0600'
    when: not stat_trix_key.stat.exists

  # An HA pair must hold the same key, or a token minted on one controller is
  # refused by the other. Push it through the sync directory exactly as the
  # ds389 and ssl-cert roles do with theirs.
  - block:
    - name: Ensure the trix sync directory exists
      file:
        path: '{{ trix_sync }}/trix'
        state: directory

    - name: Add the trix keypair to sync
      copy:
        remote_src: true
        src: '{{ trix_ssl }}/{{ item }}'
        dest: '{{ trix_sync }}/trix/'
        mode: '0600'
      loop:
        - trix.ed25519
        - trix.ed25519.pub
    when:
      - primary | default(True)
      - ha | default(False)

  - name: Copy the trix keypair from sync
    copy:
      remote_src: true
      src: '{{ trix_sync }}/trix/{{ item }}'
      dest: '{{ trix_ssl }}/'
      mode: '0600'
    loop:
      - trix.ed25519
      - trix.ed25519.pub
    when:
      - not primary | default(False)
      - ha | default(False)
