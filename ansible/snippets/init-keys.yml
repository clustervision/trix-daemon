---
# NOT NEEDED BY DEFAULT: HS256 uses {{ trix_ssl }}/secret.key, which the block
# above already creates for luna.ini and an HA pair already shares.

# Apply this only for trixd_token_algorithm = EdDSA, which Luna cannot yet speak.

# Append to site/roles/trinity/init/tasks/keys.yml, beside luna's secret.key. Same
# create-once idiom, so a re-run never replaces a key that tokens were signed with.

# The keypair must exist before either daemon starts, which is why it lives here
# and not in the trix-daemon role.

- block:
  - name: Verify if the trix signing key exists
    stat:
      path: "{{ trix_ssl }}/trix.ed25519"
    register: stat_trix_key

  - block:
    - name: Generate the trix-daemon keypair
      command: >-
        {{ trix_local }}/python/bin/python3 -c
        "from cryptography.hazmat.primitives import serialization as s;
        from cryptography.hazmat.primitives.asymmetric import ed25519 as e;
        k=e.Ed25519PrivateKey.generate();
        open('{{ trix_ssl }}/trix.ed25519','wb').write(k.private_bytes(s.Encoding.PEM,
        s.PrivateFormat.PKCS8, s.NoEncryption()));
        open('{{ trix_ssl }}/trix.ed25519.pub','wb').write(k.public_key().public_bytes(
        s.Encoding.PEM, s.PublicFormat.SubjectPublicKeyInfo))"
      args:
        creates: "{{ trix_ssl }}/trix.ed25519"

    - name: Restrict the private key
      file:
        path: "{{ trix_ssl }}/trix.ed25519"
        mode: '0600'
    when: not stat_trix_key.stat.exists

  # An HA pair needs the same key, or one controller refuses the other's tokens.
  # Sync it exactly as the ds389 and ssl-cert roles sync theirs.
  - block:
    - name: Ensure the trix sync directory exists
      file:
        path: '{{ trix_sync }}/trix'
        state: directory

    - name: Add the trix keypair to sync
      copy:
        remote_src: true
        src: '{{ trix_ssl }}/{{ item }}'
        dest: '{{ trix_sync }}/trix/'
        mode: '0600'
      loop:
        - trix.ed25519
        - trix.ed25519.pub
    when:
      - primary | default(True)
      - ha | default(False)

  - name: Copy the trix keypair from sync
    copy:
      remote_src: true
      src: '{{ trix_sync }}/trix/{{ item }}'
      dest: '{{ trix_ssl }}/'
      mode: '0600'
    loop:
      - trix.ed25519
      - trix.ed25519.pub
    when:
      - not primary | default(False)
      - ha | default(False)
