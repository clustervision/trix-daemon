---
# NOT NEEDED BY DEFAULT. Under HS256, the default, trix-daemon signs with the secret
# luna.ini is templated from, and nothing here applies. Use this only for
# trixd_token_algorithm = EdDSA, which Luna cannot verify yet.

# Append to site/roles/trinity/init/tasks/keys.yml, beside luna's secret.key. openssl,
# not Python: init runs before trinity/luna2 installs /trinity/local/python. "creates"
# means a re-run never replaces a key that tokens were signed with.

# In an HA pair the trix-daemon role copies the keypair from the primary to the
# secondary, after sync-secrets has run, so nothing is synced here.

- name: Generate the trix-daemon signing key
  command: openssl genpkey -algorithm ed25519 -out {{ trix_ssl }}/trix.ed25519
  args:
    creates: "{{ trix_ssl }}/trix.ed25519"

- name: Restrict the signing key
  file:
    path: "{{ trix_ssl }}/trix.ed25519"
    mode: '0600'

- name: Derive the public key
  command: openssl pkey -in {{ trix_ssl }}/trix.ed25519 -pubout -out {{ trix_ssl }}/trix.ed25519.pub
  args:
    creates: "{{ trix_ssl }}/trix.ed25519.pub"
