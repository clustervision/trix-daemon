---
# Defaults for the trix-daemon role.

trixd_packages:
  - luna2-python

trixd_root: '{{ trix_local }}/trix'
trixd_config_dir: '{{ trixd_root }}/daemon/config'
trixd_db_dir: '{{ trixd_root }}/daemon/common'
trixd_log_dir: /var/log/trix

# Pin the wheel, or leave it undefined to take the newest the index offers. The
# name follows the published link, as luna2_daemon does.
trixd_pip: trix_daemon-1.0-py3-none-any.whl
trixd_noarch_pip_repository: "https://updates.clustervision.com/trinityx/{{ trix_version }}/trix/noarch/pip/{{ trix_stream }}"

trixd_tls_port: 8051
trixd_plain_port: 8050
# The loopback by default. A token on the cluster network in clear text is
# readable by anything on it, and that interface is in the trusted zone.
trixd_plain_bind: 127.0.0.1

# The secret Luna already holds, written once by trinity/init and templated into
# luna.ini from the same file, so either daemon accepts the other's tokens.
trixd_token_algorithm: HS256
trixd_secret_file: '{{ trix_ssl }}/secret.key'

# Read only when trixd_token_algorithm is EdDSA, which needs Luna to speak it too.
trixd_key: '{{ trix_ssl }}/trix.ed25519'
trixd_key_id: trix-1
trixd_trust_dir: '{{ trix_ssl }}/trust.d'

trixd_username: trix
trixd_token_expiry: 1h

trixd_plugins:
  - directory
  - prometheus
  - services
  - slurm
  - genders

trixd_resolve_users: local, directory
trixd_replication_interval: 300s
trixd_luna_hash_interval: 60s
