---
# Defaults for the trix-daemon role.

trixd_packages:
  - luna2-python

trixd_root: '{{ trix_local }}/trix'
# Outside daemon, which is a symlink into site-packages: anything under it is
# replaced by a pip upgrade, and a directory there stops the symlink being made.
trixd_config_dir: '{{ trixd_root }}/etc'
trixd_db_dir: '{{ trixd_root }}/var'
trixd_log_dir: /var/log/trix

# Pin the wheel, or leave it undefined to take the newest the index offers. The
# name follows the published link, as luna2_daemon does.
trixd_pip: trix_daemon-1.0-py3-none-any.whl
trixd_noarch_pip_repository: "https://updates.clustervision.com/trinityx/{{ trix_version }}/trix/noarch/pip/{{ trix_stream }}"

trixd_tls_port: 8050
trixd_plain_port: 8051
# The loopback by default. A token on the cluster network in clear text is
# readable by anything on it, and that interface is in the trusted zone.
trixd_plain_bind: 127.0.0.1

# The secret Luna already holds, written once by trinity/init and templated into
# luna.ini from the same file, so either daemon accepts the other's tokens.
trixd_token_algorithm: HS256
trixd_secret_file: '{{ trix_ssl }}/secret.key'

# Read only when trixd_token_algorithm is EdDSA, which needs Luna to speak it too.
trixd_key: '{{ trix_ssl }}/trix.ed25519'
trixd_key_id: trix-1
trixd_trust_dir: '{{ trix_ssl }}/trust.d'

trixd_username: trix
# Generated once, on the controller that runs the play, as the ood role makes its
# passphrase, so every trixd.ini the role renders carries the same password.
trixd_password: "{{ lookup('password', '/etc/trinity/passwords/trix/api.txt chars=ascii_letters,digits') }}"
trixd_token_expiry: 1h

# A client's trixd.ini goes wherever a luna.ini goes. Clients reach the TLS
# listener; the plain one stays on the loopback. Remote clients use the
# controller's cluster name, which follows the active controller in a pair.
trixd_client_protocol: https
trixd_client_endpoint: '{{ trix_ctrl_hostname }}.{{ trix_domain }}'
trixd_verify_certificate: '{{ luna_verify_certificate | default(False) }}'
trixd_cli_config_dir: '{{ trixd_root }}/cli/config'
trixd_node_config_dir: '{{ trixd_root }}/node/config'
trixd_alertx_config_dir: '{{ trix_local }}/alertx/cli/config'
trixd_ood_config_dir: '{{ trix_ood }}/3.0/config'
trixd_ood_group: "{{ ood_apps_admin_group | default('admins') }}"

trixd_plugins:
  - directory
  - prometheus
  - services
  - slurm
  - genders

trixd_auth_chain: local, pam

# Point this at a facade where there is no systemd, as in a container.
trixd_service_command: /usr/bin/systemctl
trixd_replication_interval: 300s
trixd_luna_hash_interval: 60s
