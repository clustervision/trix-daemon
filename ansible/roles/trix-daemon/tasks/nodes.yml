---
# The node's trixd.ini, beside its luna.ini and under the same two conditions as
# luna2's nodes.yml: written into an image from the controller, or in place when
# the play runs inside an image or on a node. The node hook reads it.

- block:
  - name: Create the node trixd config directory in the image
    file:
      path: '{{ image_path }}/{{ trixd_node_config_dir }}/'
      state: directory

  - name: Render the node trixd.ini into the image
    template:
      src: trixd-client.ini.j2
      dest: '{{ image_path }}/{{ trixd_node_config_dir }}/trixd.ini'
      owner: root
      group: root
      mode: '0640'
  when:
    - on_controller | default(False)
    - image_path is defined
    - trix_local is defined

- block:
  - name: Create the node trixd config directory
    file:
      path: '{{ trixd_node_config_dir }}/'
      state: directory

  - name: Render the node trixd.ini
    template:
      src: trixd-client.ini.j2
      dest: '{{ trixd_node_config_dir }}/trixd.ini'
      owner: root
      group: root
      mode: '0640'
  when:
    - in_image | default(False) or on_node | default(False)
    - trix_local is defined
