---
# The command line's trixd.ini, as luna2 places luna.ini in cli/config. It names
# this controller, as the CLI's luna.ini does.

- name: Create the trixd CLI config directory
  file:
    path: '{{ trixd_cli_config_dir }}'
    state: directory
    mode: '0755'

- name: Render the CLI trixd.ini
  template:
    src: trixd-client.ini.j2
    dest: '{{ trixd_cli_config_dir }}/trixd.ini'
    owner: root
    group: root
    mode: '0640'
  vars:
    trixd_client_endpoint: '{{ ansible_hostname }}'
