---
# Called by trinity/alertx straight after it renders the CLI's luna.ini. That
# directory sits behind a symlink into site-packages which the alertx role makes,
# so it cannot be written before that role has run. It names this controller, as
# the alertx luna.ini does.

- name: Render the alertx trixd.ini
  template:
    src: trixd-client.ini.j2
    dest: '{{ trixd_alertx_config_dir }}/trixd.ini'
    owner: root
    group: root
    mode: '0640'
  vars:
    trixd_client_endpoint: '{{ ansible_hostname }}'
