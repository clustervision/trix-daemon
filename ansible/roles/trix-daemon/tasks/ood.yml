---
# Called by trinity/ood-apps straight after it renders the apps' luna.ini, under
# the same condition. The apps' 3.0 directory is a symlink to the current build and
# is re-pointed on an upgrade, so this file is only safe to write after the switch.
# Group-readable as luna.ini is: an admin's apps act as rootus, anyone else signs
# in as themselves.

- name: Render the OOD apps trixd.ini
  template:
    src: trixd-client.ini.j2
    dest: '{{ trixd_ood_config_dir }}/trixd.ini'
    owner: root
    group: '{{ trixd_ood_group }}'
    mode: '0640'
