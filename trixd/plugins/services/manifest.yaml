plugin: services
backend: backend
description: >
  Generic start, stop, restart, reload and status over systemd. Luna keeps its own
  private path for restarting the DHCP and DNS it configures, and never calls
  another daemon to do so.

schemas:
  catalogue:
    services: {type: object}

endpoints:
  - path: ""
    methods: [GET]
    minimum: none
    handler: list_services
    summary: Every service this daemon is allowed to control

  - path: catalogue
    methods: [GET]
    minimum: none
    handler: catalogue
    summary: Which names map to which systemd units

  - path: catalogue
    methods: [PATCH]
    minimum: manager
    handler: catalogue
    schema: catalogue
    summary: Which names map to which systemd units

  - path: <name>
    methods: [GET]
    minimum: none
    handler: status
    summary: Whether one service is running

  - path: <name>/actions/<action>
    methods: [POST]
    minimum: operator
    handler: act
    summary: Start, stop, restart or reload one service
  - path: status/<request_id>
    methods: [GET]
    minimum: none
    handler: request
    summary: Where one queued action got to
