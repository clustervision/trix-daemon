plugin: slurm
backend: backend
description: >
  The managed blocks of the slurm node, partition and gres files, rendered from
  Luna's nodes through the trinityx-config-slurm package. One writer per file.

schemas:
  config:
    nodes_file:      {type: string, optional: true}
    partitions_file: {type: string, optional: true}
    gres_file:       {type: string, optional: true}
    manager:         {type: string, optional: true}
    reconfigure:     {type: string, optional: true}

endpoints:
  - path: config
    methods: [GET]
    minimum: reader
    handler: config
    summary: Where this plugin writes and what it runs afterwards

  - path: config
    methods: [PATCH]
    # rootus: these are paths the daemon writes and a command it runs, both as root.
    minimum: rootus
    handler: config
    schema: config
    summary: Where this plugin writes and what it runs afterwards

  - path: renders/config
    methods: [GET]
    minimum: reader
    handler: render_config
    render:
      inputs: [luna.node, luna.group]
      coalesce: 2s
      serve: json
    summary: What the last render wrote
