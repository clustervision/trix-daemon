plugin: slurm
backend: backend
description: >
  The managed blocks of the slurm node, partition and gres files, rendered here
  from Luna's nodes and each file's own presets, and the person's own changes to
  them (drain, resume, save, restore, apply), run by helper.py as the
  account trinityx-slurm. A person makes each change with their own trixd token,
  and Luna, asked as that person through the luna plugin, decides whether they
  may; rootus passes, as it passes the route to Luna.

schemas:
  config:
    nodes_file:
      type: string
      optional: true
      pattern: "^/"
      description: The slurm file holding the node block
      example: /etc/slurm/slurm-nodes.conf
    partitions_file:
      type: string
      optional: true
      pattern: "^/"
      description: The slurm file holding the partition block
      example: /etc/slurm/slurm-partitions.conf
    gres_file:
      type: string
      optional: true
      pattern: "^/"
      description: The slurm file holding the gres block
      example: /etc/slurm/gres.conf
    manager:
      type: string
      optional: true
      description: The name of the managed block in each file
      example: TrinityX
    reconfigure:
      type: string
      optional: true
      pattern: "^/\\S+"
      description: Run after a write, so slurm reads the files again
      example: /usr/bin/scontrol reconfigure
    admin_group:
      type: string
      optional: true
      pattern: "^[a-z_][a-z0-9_-]*$"
      description: The group the Slurm files belong to with group write (the installer's admin group); a save and a restore run with it
      example: admins
  drain:
    names: &names
      type: array
      items: string
      description: The nodes to change, each a name Luna renders into the node file
      example: [node001, node002]
    reason:
      type: string
      description: Why, one line of at most 200 characters, never the drainer's mark
      example: bad DIMM
  resume:
    names: *names
  preview:
    mode:
      type: string
      pattern: "^(save|restore)$"
      description: save (the texts sent) or restore (the backups' texts)
      example: save
    stamp: &stamp
      type: object
      description: The sha256 of each file as the page loaded it (GET files' stamp)
      example: {nodes: 9f86d08..., partitions: 60303ae..., gres: fd61a03...}
    texts: &texts
      type: object
      optional: true
      description: The new text of nodes, partitions and gres
      example: {nodes: "...", partitions: "...", gres: "..."}
    force: &force
      type: boolean
      optional: true
      description: With mode restore, the restore whatever the backups' lines are, which a save's rules on changed lines would refuse; Luna's block is rendered afterwards rather than restored
      example: false
  save:
    texts:
      type: object
      description: The new text of nodes, partitions and gres
      example: {nodes: "...", partitions: "...", gres: "..."}
    stamp: *stamp
    judged: &states
      type: array
      items: string
      description: The nodes whose State the texts change (preview's states); the person needs Luna's hardware right on each
      example: []
    rules: &rules
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: The sha256 of the console's save rules; refused when it is not this plugin's
      example: 66e57fbc1672d13853b9b6e35d4ff1aee09bdd5a2f2cfb0ce79a0265ef853d2b
  restore:
    stamp: *stamp
    judged: *states
    rules: *rules
    force: *force
  init:
    reset:
      type: boolean
      optional: true
      description: Empty the Defaults block of all three files, keep every line outside the blocks and render the TrinityX block afresh, instead of only giving a file without the managed block its blocks
      example: false
    force:
      type: boolean
      optional: true
      description: With reset, put this plugin's default files back whatever the three hold, the lines outside the blocks included; refused without reset
      example: false

endpoints:
  - path: config
    methods: [GET]
    minimum: reader
    handler: config
    summary: Where the plugin writes slurm's files, and what it runs afterwards
    description: |
      Where the slurm plugin writes the managed blocks of slurm's node, partition and gres
      files, the name of the managed block in each, and the command it runs after writing,
      which makes slurm read them again.
    response:
      description: The settings as held
      example: {nodes_file: /etc/slurm/slurm-nodes.conf, partitions_file: /etc/slurm/slurm-partitions.conf, gres_file: /etc/slurm/gres.conf, manager: TrinityX, reconfigure: /usr/bin/scontrol reconfigure}

  - path: config
    methods: [PATCH]
    # rootus: these are paths the daemon writes and a command it runs, both as root.
    minimum: rootus
    handler: config
    schema: config
    summary: Change where the plugin writes slurm's files, or what it runs afterwards
    description: |
      Send any of the settings; those left out keep their value, and the next render uses
      them. rootus only, because the daemon writes these files and runs `reconfigure`, both
      as root.
    request_example: {reconfigure: /usr/bin/scontrol reconfigure}
    response:
      description: The settings as now held
      example: {nodes_file: /etc/slurm/slurm-nodes.conf, partitions_file: /etc/slurm/slurm-partitions.conf, gres_file: /etc/slurm/gres.conf, manager: TrinityX, reconfigure: /usr/bin/scontrol reconfigure}

  - path: renders/config
    methods: [GET]
    minimum: reader
    handler: render_config
    render:
      inputs: [luna.node, luna.group]
      coalesce: 2s
      serve: json
      reconcile: true
      reloads: [slurm]
    summary: What the last slurm render wrote
    description: |
      The last render of slurm's managed blocks: how many nodes it wrote, the files, and
      whether `reconfigure` ran without error. It renders when a node or group changes
      through the luna plugin, at most every two seconds in a burst, and on a notify.
      A node name new to the files waits up to 60 s for DNS, so slurm is not reconfigured first.
      Reading this writes nothing: it answers from the last run, and slurm is reconfigured
      only where the generated blocks differ from what is on disk.
    response:
      description: What the last render wrote
      example: {nodes: 10, files: [/etc/slurm/gres.conf, /etc/slurm/slurm-nodes.conf, /etc/slurm/slurm-partitions.conf], reconfigured: true}
    errors:
      404: The render has not run yet, or its last run failed; the message says why

  - path: files
    methods: [GET]
    minimum: reader
    handler: files
    summary: Whether the person's Slurm changes can be written, and the files as they are
    description: |
      Every gap that stops a save, a restore, a drain or a resume, as a sentence (`why`):
      a file missing or not writable by the helper's account, a `.bkp` that is a link (a
      save puts a backup's owner, group and mode right and makes a missing one), slurm not
      granting the account AdminLevel Administrator (`granted`, asked once a minute). The
      sha256 of each file (`stamp`, sent back with a save), the sha256 of the save rules
      (`rules`) and the account the helper runs as.
    response:
      description: The gaps, the stamp and the rules' digest
      example: {why: [], granted: "", stamp: {nodes: 9f86d08..., partitions: 60303ae..., gres: fd61a03...}, rules: 66e57fbc..., account: trinityx-slurm}
    errors:
      502: The helper did not answer
      503: The helper's account, env, setpriv or prlimit is missing, or the files are not configured

  - path: nodes
    methods: [GET]
    minimum: reader
    handler: nodes
    summary: The nodes and the group of each, as the render reads them from Luna
    description: |
      Every node Luna holds, by name and in name order, each with the group it is in. A node
      Luna holds without a group is listed with `group` empty rather than left out: what to
      do with such a node is each render's own decision, and the slurm render leaves it out
      of the node file and names it in `renders/config`. This is the list the node,
      partition and gres blocks are built from, so it is also what a name in a drain, a
      resume or an edited node file is held against.
    response:
      description: Every node and its group
      example: [{name: node001, group: compute}, {name: node002, group: ""}]
    errors:
      503: Luna did not answer, or answered in a shape this daemon cannot read

  - path: nodes/actions/drain
    methods: [POST]
    minimum: operator
    handler: drain
    schema: drain
    summary: Drain nodes, the person written in front of the reason
    description: |
      `scontrol update NodeName=<names> State=DRAIN Reason="[person] reason"`, run by the
      helper as its account, for the person whose trixd token made the request (or rootus).
      Luna's x on every node named, asked as that person; refused whole when a node lacks it,
      or when a name is not a node Luna renders into the node file.
    request_example: {names: [node001], reason: bad DIMM}
    response:
      description: The nodes changed
      example: {names: [node001], did: drain node001}
    errors:
      400: A name or the reason is refused; the message says which
      401: 'No token, or one that is not valid; or, marked `WWW-Authenticate: Bearer realm="luna"`, Luna needs the person''s own sign-in: `POST /api/v1/luna/token`'
      403: The caller is neither a person nor rootus, or Luna refuses the person, in Luna's words
      409: Another change is under way
      502: scontrol refused or did not answer, or the helper did not answer; the outcome of a silent one is unknown
      503: slurm has not made the account an Administrator, or a tool is missing; or Luna did not answer

  - path: nodes/actions/resume
    methods: [POST]
    minimum: operator
    handler: resume
    schema: resume
    summary: Resume nodes
    description: |
      `scontrol update NodeName=<names> State=RESUME`, as drain is asked and refused.
    request_example: {names: [node001]}
    response:
      description: The nodes changed
      example: {names: [node001], did: resume node001}
    errors:
      400: A name is refused
      401: 'No token, or one that is not valid; or, marked `WWW-Authenticate: Bearer realm="luna"`, Luna needs the person''s own sign-in: `POST /api/v1/luna/token`'
      403: The caller is neither a person nor rootus, or Luna refuses the person, in Luna's words
      409: Another change is under way
      502: scontrol refused or did not answer, or the helper did not answer; the outcome of a silent one is unknown
      503: slurm has not made the account an Administrator, or a tool is missing; or Luna did not answer

  - path: files/actions/preview
    methods: [POST]
    minimum: manager
    handler: preview
    schema: preview
    summary: The nodes whose State a save or a restore would change
    description: |
      Judged as the write would be (the stamp, the TrinityX block, the lines the editor may
      change, slurmlint), writing nothing; a refusal the write would meet comes back in
      `refused`, so the console can say it before the person saves. With `force` and mode
      restore it answers for a forced restore, judged in the daemon as that is: the `states`
      to send as its `judged`.
    request_example: {mode: save, stamp: {nodes: 9f86d08..., partitions: 60303ae..., gres: fd61a03...}, texts: {nodes: "...", partitions: "...", gres: "..."}}
    response:
      description: The State changes, or why the write would be refused
      example: {states: [node004], refused: ""}
    errors:
      403: The caller is neither a person nor rootus
      502: The helper did not answer
      503: A file or backup is missing or not writable, or a tool is missing

  - path: files/actions/save
    methods: [POST]
    minimum: manager
    handler: save
    schema: save
    summary: Write the person's texts of the node, partition and gres files
    request_example: {texts: {nodes: "...", partitions: "...", gres: "..."}, stamp: {nodes: 9f86d08..., partitions: 60303ae..., gres: fd61a03...}, judged: [], rules: 66e57fbc1672d13853b9b6e35d4ff1aee09bdd5a2f2cfb0ce79a0265ef853d2b}
    description: |
      The backups first, then the three files, whole or not at all: one save, restore, apply
      or render at a time on either controller (a lock beside the files), a mark before the
      first byte so a cut write is put back. Refused when the files changed since the page
      loaded them (`stamp`), when a changed line is not one the editor makes, when slurmlint
      refuses, when `judged` is not the State changes the texts make, and when `rules` is not
      this plugin's. Luna's w on the cluster, and the hardware right on each node in
      `judged`, asked as the person. Slurm's commands read the files as soon as they are
      written; slurmctld reads them on apply. `judged` holds at most 4096 nodes, and a State
      change on a preset counts every node, so on a cluster of more nodes such a save answers
      400.
    response:
      description: The files' new stamp
      example: {stamp: {nodes: 9f86d08..., partitions: 60303ae..., gres: fd61a03...}}
    errors:
      400: A text, `judged` (at most 4096 nodes), or slurmlint's lines
      401: 'No token, or one that is not valid; or, marked `WWW-Authenticate: Bearer realm="luna"`, Luna needs the person''s own sign-in: `POST /api/v1/luna/token`'
      403: The caller is neither a person nor rootus, or Luna refuses the person, in Luna's words
      409: Stale, not Luna's files, a line the editor cannot make, the State changes or the rules differ, another change under way, a cut save put back, or a file rewritten while the helper wrote it
      502: A write failed and what the helper wrote is put back, or the helper did not answer; or Luna does not say who holds the hardware right
      503: A file or backup is missing or not writable, slurmlint is absent, a cut save's mark cannot be read, or a tool is missing; or Luna did not answer

  - path: files/actions/restore
    methods: [POST]
    minimum: manager
    handler: restore
    schema: restore
    summary: Write the backups' texts back to the three files
    request_example: {stamp: {nodes: 9f86d08..., partitions: 60303ae..., gres: fd61a03...}, judged: [], rules: 66e57fbc1672d13853b9b6e35d4ff1aee09bdd5a2f2cfb0ce79a0265ef853d2b}
    description: |
      As a save of the `.bkp` texts, the backups kept. There is one `.bkp` per file, which
      every save rewrites, and the OOD Slurm configurator writes the same names: Restore puts
      back the set before the latest save by either, not necessarily before the person's own.
      `judged` is held to 4096 nodes as a save's is. With `force` the rules on changed lines
      are not applied, so a set whose lines outside the blocks differ goes back as well, as
      the backups an init's `reset` leaves do. The daemon then writes the files itself, as
      an init does and under the same lock: each backup's lines and its Defaults block, the
      TrinityX block as the file holds it now (added where the backup has none), the files
      as they were to each `.bkp`, so a second forced restore undoes the first; then the
      render writes Luna's nodes afresh (`rendered`; where false, `renders/config` says why,
      the files keep the nodes they had, and the render runs again on the next node or
      group change). slurmctld reads the restored lines where the render changed a block,
      and otherwise on apply. Still held to the stamp, `rules`, slurmlint where it is
      installed, and Luna's rights; a node's State set outside the blocks that differs
      counts every node in `judged` (preview with `force` answers them). A backup is read
      only as a plain file of at most 4 MiB, never through a link.
    response:
      description: The files' new stamp, and for a forced restore whether the render then wrote
      example: {stamp: {nodes: 9f86d08..., partitions: 60303ae..., gres: fd61a03...}}
    errors:
      400: '`judged` (at most 4096 nodes), or slurmlint''s lines'
      401: As a save
      403: As a save
      409: As a save
      502: As a save; a forced restore that could not write says which of the six are not put back
      503: A backup cannot be read, or as a save; or Luna did not answer

  - path: files/actions/init
    methods: [POST]
    minimum: manager
    handler: init
    schema: init
    summary: Give the node, partition and gres files their managed blocks, empty their presets, or put the default files back
    request_example: {reset: false}
    description: |
      A file without the TrinityX managed block gains the Defaults block and the TrinityX
      block at its end, everything it holds kept; this is what makes a file one the render
      writes, and the installer calls it once the files are in place. Refused 409 when all
      three carry the block already. With `reset`, the Defaults block of each of the three
      is emptied and every line outside the blocks is kept; with `force` as well, each
      becomes this plugin's default file under an empty Defaults block, whatever it held.
      Either way the TrinityX block stays as it is until the render writes it afresh, so a
      render that cannot run leaves the nodes that were there. The daemon writes the files
      itself, as the render does and under the lock the render and a save take: the files
      as they were to each `.bkp` first, then the three, put back where a write fails;
      judged by slurmlint where it is installed. Restore writes those backups back as it
      writes any, held to a save's rules, so it refuses a set whose presets or lines
      outside the blocks a save could not have made; Restore with `force` puts that one
      back. The render runs before the answer, so Luna's nodes are in the files
      (`rendered`; where false, `renders/config` says why, and the render runs again on
      the next node or group change). slurmctld reads a reset's lines where the render
      changed a block, and otherwise on apply. Luna's w on the cluster, asked as the
      person; with `reset` also the hardware right on each node whose State the reset
      changes, as a save needs it.
    response:
      description: The files written, and whether the render then wrote
      example: {files: [/etc/slurm/gres.conf, /etc/slurm/slurm-nodes.conf, /etc/slurm/slurm-partitions.conf], rendered: true}
    errors:
      400: slurmlint's lines, or `force` without `reset`
      401: As a save
      403: The caller is neither a person nor rootus, or Luna refuses the person, in Luna's words
      409: All three files carry the managed block already (send `reset`); or another change holds the files, or they changed while Luna was asked
      502: A file cannot be read or written, the lock cannot be taken, or a cut save is not put back yet
      503: Luna did not answer

  - path: files/actions/apply
    methods: [POST]
    minimum: manager
    handler: apply
    summary: Make slurm read its files again
    description: |
      `scontrol reconfigure`, run by the helper under the lock, for a person holding Luna's
      w on the cluster; slurmctld refuses what it cannot load and keeps serving.
    response:
      description: Done
      example: {}
    errors:
      401: As a save
      403: The caller is neither a person nor rootus, or Luna refuses the person, in Luna's words
      409: Another change is under way, or a cut save is not put back yet
      502: scontrol refused or did not answer, or the helper did not answer
      503: A tool is missing, or the files are not configured; or Luna did not answer
