plugin: luna
backend: backend
description: >
  The one route to Luna: /api/v1/luna/<anything> goes to Luna as it was sent, and Luna
  decides who may. A node renamed, moved or deleted through it runs the Luna hooks the
  other plugins declare.

endpoints:
  - path: <path:rest>
    methods: [GET, POST, PATCH, DELETE]
    forward: true
    handler: forward
    summary: Forward to Luna, unchanged
