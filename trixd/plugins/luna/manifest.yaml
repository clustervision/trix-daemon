plugin: luna
backend: backend
description: >
  The one route to Luna: /api/v1/luna/<anything> goes to Luna as it was sent, and Luna
  decides who may. A node renamed, moved or deleted through it runs the Luna hooks the
  other plugins declare.

endpoints:
  - path: <path:rest>
    methods: [GET, POST, PATCH, DELETE]
    forward: true
    handler: forward
    summary: Forward to Luna, unchanged
    description: |
      Anything under `/api/v1/luna/` goes to Luna, luna2-daemon, as it was sent, less the
      `/api/v1/luna` prefix and the connection headers, at the address Luna's own
      `luna.ini` names; Luna's answer comes back unchanged. Luna decides who may: send a
      token Luna accepts, which the ini account's is. What Luna offers is Luna's own API.

      A node renamed, moved to another group or deleted through this route also updates
      what trixd keeps for it, such as the node's hardware rule file.
    params:
      rest: {description: "Luna's own path, as you would call it at Luna", example: version}
    response:
      description: Luna's answer, unchanged
      example: {version: {api: 1, commit: 711e3a5---DUMMY---278ad6399b, luna: "2.2.0001"}}
    errors:
      503: Luna is not answering
