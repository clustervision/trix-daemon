plugin: prometheus
backend: backend
description: >
  The whole Prometheus surface as one plugin: service discovery targets, the
  generic and service rule files, the per-node hardware rules and the settings
  they are generated from. One plugin means one writer of the configuration.

luna_hooks:
  node.update: node_updated
  node.delete: node_deleted
schemas:
  rules:
    groups:   {type: array, items: object}
  settings:
    settings: {type: object}
  hw_rules:
    force:    {type: boolean, optional: true}
    nhc:      {type: boolean, optional: true}
    disabled: {type: boolean, optional: true}
  # Each entry: node, and any of force, nhc and disabled as above.
  hw_rules_many:
    nodes:    {type: array, items: object}
  config:
    rules_directory: {type: string, optional: true}
    prometheus_url:  {type: string, optional: true}
    reload_command:  {type: string, optional: true}

endpoints:
  - path: config
    methods: [GET]
    minimum: none
    handler: config
    summary: Where this plugin writes, and what it reloads

  - path: config
    methods: [PATCH]
    # rootus: these are a path the daemon writes and a command it runs, both as root.
    minimum: rootus
    handler: config
    schema: config
    summary: Where this plugin writes, and what it reloads

  - path: rules
    methods: [GET]
    minimum: none
    handler: rules
    summary: The generic and service alert rules

  - path: rules
    methods: [PATCH]
    minimum: manager
    handler: rules
    schema: rules
    summary: The generic and service alert rules

  - path: settings
    methods: [GET]
    minimum: none
    handler: settings
    summary: The settings hardware rules are generated from

  - path: settings
    methods: [PATCH]
    minimum: manager
    handler: settings
    schema: settings
    summary: The settings hardware rules are generated from

  - path: hw-rules/<node>
    methods: [GET]
    minimum: none
    handler: get_hw_rules
    summary: The hardware rules held for one node

  - path: hw-rules/<node>
    methods: [PATCH]
    token: node
    handler: import_hw_rules
    schema: hw_rules
    summary: A node asks for its own hardware rules to be generated

  - path: hw-rules
    methods: [PATCH]
    minimum: manager
    handler: set_hw_rules
    schema: hw_rules_many
    summary: Regenerate, or switch the alerts of, several nodes' hardware rules

  - path: renders/targets
    methods: [GET]
    public: true
    handler: render_targets
    render:
      inputs: [luna.node, luna.network]
      serve: json
      coalesce: 2s
    summary: Service discovery targets, served from the render

  - path: renders/rule-files
    methods: [GET]
    minimum: none
    handler: render_rule_files
    render:
      inputs: [settings, rules, luna.node]
    # No serve: this render writes the rule files and answers nothing over HTTP.
    summary: The rule files on disk
