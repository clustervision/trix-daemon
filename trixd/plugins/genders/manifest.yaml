plugin: genders
backend: backend
description: >
  The genders file, rendered here from the same node list the slurm blocks are
  built from.

schemas:
  init:
    reset:
      type: boolean
      optional: true
      description: Keep every line of the file and render the managed block afresh, instead of only giving a file without the block one
      example: false
    force:
      type: boolean
      optional: true
      description: With reset, leave nothing in the file but the managed block; refused without reset
      example: false

endpoints:
  - path: config
    methods: [GET]
    minimum: reader
    handler: config
    summary: Where the plugin writes the genders file
    description: |
      The genders file and the name of its managed block. The installer fixes both, so
      there is nothing to change here.
    response:
      description: Where the plugin writes
      example: {genders_file: /etc/genders, managed_block: TrinityX}

  - path: renders/genders
    methods: [GET]
    minimum: reader
    handler: render_genders
    render:
      inputs: [luna.node, luna.group]
      coalesce: 2s
      serve: json
      # Nothing to reload: every reader of the genders file opens it for itself.
      reconcile: true
    summary: What the last genders render wrote
    description: |
      The last render of the genders file: how many nodes it wrote, and where. It renders
      when a node or group changes through the luna plugin, at most every two seconds in a
      burst, and on a notify. Reading this writes nothing: it answers from the last run.
    response:
      description: What the last render wrote
      example: {nodes: 10, file: /etc/genders}
    errors:
      404: The render has not run yet, or its last run failed; the message says why

  - path: files/actions/init
    methods: [POST]
    minimum: manager
    handler: init
    schema: init
    summary: Give the genders file its managed block, render it afresh, or empty the file down to it
    request_example: {reset: false}
    description: |
      A file without the TrinityX managed block gains it at its end, everything it holds
      kept; this is what makes the file one the render writes, and the installer calls it
      once the file is in place. Refused 409 when the file carries the block already. With
      `reset`, every line outside the block is kept; with `force` as well, the file is left
      holding the block alone. Either way the file as it was is kept beside it as `.bkp`,
      which `files/actions/restore` puts back, and the block stays as it is until the
      render writes it afresh before the answer (`rendered`; where false, `renders/genders`
      says why, the file keeps the nodes it had, and the render runs again on the next node
      or group change).
    response:
      description: The file, the backup a reset made, and whether the render then wrote
      example: {file: /etc/genders, rendered: true}
    errors:
      400: '`force` without `reset`'
      409: The file carries the managed block already (send `reset`)
      502: The file cannot be read or written

  - path: files/actions/restore
    methods: [POST]
    minimum: manager
    handler: restore
    summary: Put the genders file's backup back
    description: |
      The lines the `.bkp` beside the file holds outside the TrinityX managed block go back
      into the file, the block as the file holds it now (added where the backup has none),
      and the file as it was becomes the `.bkp`, so a second restore undoes the first. The
      render writes the block afresh before the answer (`rendered`; where false,
      `renders/genders` says why and the file keeps the nodes it had). The backup is read
      only as a plain file of at most 4 MiB, never through a link; a write that fails puts
      the file back and leaves the backup as it was.
    response:
      description: The file, its backup, and whether the render then wrote
      example: {file: /etc/genders, backup: /etc/genders.bkp, rendered: true}
    errors:
      502: The file or its backup cannot be read or written; the message says what was put back
