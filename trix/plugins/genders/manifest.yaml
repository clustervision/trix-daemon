plugin: genders
backend: backend
description: >
  The genders file, rendered from the same node list through the
  trinityx-config-genders package.

schemas:
  config:
    genders_file: {type: string, optional: true}
    manager:      {type: string, optional: true}

endpoints:
  - path: config
    methods: [GET, PATCH]
    capability: genders.write
    handler: config
    schema: config
    summary: Where this plugin writes

  - path: renders/genders
    methods: [GET]
    capability: genders.read
    handler: render_genders
    render:
      inputs: [luna.node, luna.group]
      triggers: [luna.hook, luna.hashes]
      coalesce: 2s
      serve: json
      files: /etc/genders
      blocks: TrinityX
    summary: What the last render wrote
