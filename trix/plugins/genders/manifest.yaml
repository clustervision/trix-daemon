plugin: genders
backend: backend
description: >
  The genders file, rendered from the same node list through the
  trinityx-config-genders package.

endpoints:
  - path: config
    methods: [GET]
    minimum: none
    handler: config
    summary: Where this plugin writes, which the generator fixes

  - path: renders/genders
    methods: [GET]
    minimum: none
    handler: render_genders
    render:
      inputs: [luna.node, luna.group]
      coalesce: 2s
      serve: json
    summary: What the last render wrote
