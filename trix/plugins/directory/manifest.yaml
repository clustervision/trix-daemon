plugin: directory
backend: backend
description: Cluster users and groups, held in 389ds and managed through obol.

schemas:
  user:
    username:   {type: string, pattern: "^[a-zA-Z_][a-zA-Z0-9_.-]*$"}
    password:   {type: string, optional: true}
    uid:        {type: integer, optional: true}
    gid:        {type: integer, optional: true}
    shell:      {type: string, optional: true}
    home:       {type: string, optional: true}
    mail:       {type: string, optional: true}
    phone:      {type: string, optional: true}
    surname:    {type: string, optional: true}
    givenname:  {type: string, optional: true}
    expiry:     {type: integer, optional: true}
    groups:     {type: array, items: string, optional: true}
  group:
    groupname:  {type: string, pattern: "^[a-zA-Z_][a-zA-Z0-9_.-]*$"}
    gid:        {type: integer, optional: true}
    members:    {type: array, items: string, optional: true}

endpoints:
  - path: users
    methods: [GET]
    minimum: none
    handler: list_users
    summary: Every user in the directory

  - path: users/<name>
    methods: [GET]
    minimum: none
    handler: get_user
    summary: One user

  - path: users
    methods: [POST]
    minimum: manager
    handler: create_user
    schema: user
    summary: Create a user

  - path: users/<name>
    methods: [PATCH]
    minimum: manager
    handler: update_user
    schema: user
    summary: Update a user

  - path: users/<name>
    methods: [DELETE]
    minimum: manager
    handler: delete_user
    summary: Delete a user

  - path: groups
    methods: [GET]
    minimum: none
    handler: list_groups
    summary: Every group in the directory

  - path: groups/<name>
    methods: [GET]
    minimum: none
    handler: get_group
    summary: One group

  - path: groups
    methods: [POST]
    minimum: manager
    handler: create_group
    schema: group
    summary: Create a group

  - path: groups/<name>
    methods: [PATCH]
    minimum: manager
    handler: update_group
    schema: group
    summary: Update a group

  - path: groups/<name>
    methods: [DELETE]
    minimum: manager
    handler: delete_group
    summary: Delete a group
