plugin: slurm
backend: backend
description: >
  The managed blocks of the slurm node, partition and gres files, rendered from
  Luna's nodes through the trinityx-config-slurm package. One writer per file.

schemas:
  partitions:
    partitions: {type: object}
  config:
    nodes_file:      {type: string, optional: true}
    partitions_file: {type: string, optional: true}
    gres_file:       {type: string, optional: true}
    manager:         {type: string, optional: true}
    reconfigure:     {type: string, optional: true}

endpoints:
  - path: config
    methods: [GET, PATCH]
    capability: slurm.write
    handler: config
    schema: config
    summary: Where this plugin writes and what it runs afterwards

  - path: partitions
    methods: [GET, PATCH]
    capability: slurm.write
    handler: partitions
    schema: partitions
    summary: The partition definitions the render uses

  - path: renders/config
    methods: [GET]
    capability: slurm.read
    handler: render_config
    render:
      inputs: [luna.node, luna.group, partitions]
      triggers: [luna.hook, luna.hashes]
      coalesce: 2s
      serve: json
      files: /etc/slurm
      blocks: TrinityX
      after: [scontrol reconfigure]
    summary: What the last render wrote
