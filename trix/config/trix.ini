; Settings for trix-daemon. The Ansible role templates this file.

[LOGGER]
LEVEL = info
LOGFILE = /var/log/trix/trix-daemon.log
; One of debug, info, warning, error, critical.

[API]
BIND = 0.0.0.0:8051
INSECURE_BIND = 127.0.0.1:8050
CERTFILE =
KEYFILE =
EXPIRY = 1h
USERNAME = trix
PASSWORD = trix
; BIND carries TLS and needs CERTFILE and KEYFILE. INSECURE_BIND is plain HTTP, on
; the loopback by default: a token in clear text is readable by the whole network.

[TOKENS]
ALGORITHM = HS256
SECRET_KEY =
SECRET_FILE = /trinity/local/etc/ssl/secret.key
ISSUER = trix-daemon
PRIVATE_KEY = /trinity/local/etc/ssl/trix.ed25519
KEY_ID = trix-1
TRUST = /trinity/local/etc/ssl/trust.d
; HS256 is what luna2-daemon signs with, so either daemon accepts the other's
; tokens. Leave SECRET_KEY empty and SECRET_FILE is read, as luna.ini is.

; ALGORITHM = EdDSA uses PRIVATE_KEY, KEY_ID and TRUST instead, so a daemon that
; verifies cannot mint. It needs Luna to speak EdDSA too, and today Luna does not.

[LUNA]
ENDPOINT = controller.cluster:7050
PROTOCOL = http
VERIFY_CERTIFICATE = no
USERNAME = luna
PASSWORD = luna
TIMEOUT = 20s

[DATABASE]
URL = sqlite:////trinity/local/trix/daemon/common/trix.db

[RESOLVE]
USERS = local, directory
GROUPS = local, directory
CACHE = 60s
; First answer wins, a failing source is skipped and logged rather than waited on.

[REPLICATION]
PEERS =
INTERVAL = 300s
ENABLED = yes
; Each peer is host:port of the other controller's TLS listener. Empty on a single
; controller, which has nothing to reconcile with.

[TRIGGERS]
LUNA_HASHES = 60s
; The fallback when a config hook notification is lost. Luna answers /table/hashes
; on the HA master only, so this is inert on a single controller until that is fixed.

[PLUGINS]
DIRECTORY = /trinity/local/trix/daemon/plugins
ENABLED = directory, prometheus, services, slurm, genders
